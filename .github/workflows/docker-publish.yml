name: 🚀 Publish

# Este workflow debe ser llamado desde deploy.yml, no ejecutarse directamente
on:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image names
        shell: bash
        run: |
          IMAGE_BASE_LC="$(echo "${IMAGE_BASE}" | tr '[:upper:]' '[:lower:]')"

          echo "WEB_IMAGE=${REGISTRY}/${IMAGE_BASE_LC}-web" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=${REGISTRY}/${IMAGE_BASE_LC}-worker" >> "$GITHUB_ENV"
          echo "MIGRATE_IMAGE=${REGISTRY}/${IMAGE_BASE_LC}-migrate" >> "$GITHUB_ENV"

          echo "Web image: ${REGISTRY}/${IMAGE_BASE_LC}-web"
          echo "Worker image: ${REGISTRY}/${IMAGE_BASE_LC}-worker"
          echo "Migrate image: ${REGISTRY}/${IMAGE_BASE_LC}-migrate"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for web image
        id: meta_web
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=ref,event=branch
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Extract metadata for worker image
        id: meta_worker
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.WORKER_IMAGE }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=ref,event=branch
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Extract metadata for migrate image
        id: meta_migrate
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.MIGRATE_IMAGE }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=ref,event=branch
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push web image
        id: push_web
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          target: runner
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}

      - name: Build and push worker image
        id: push_worker
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          target: worker
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}

      - name: Build and push migrate image
        id: push_migrate
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          target: migrate
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_migrate.outputs.tags }}
          labels: ${{ steps.meta_migrate.outputs.labels }}

      - name: Generate artifact attestation for web image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.push_web.outputs.digest }}
          push-to-registry: true

      - name: Generate artifact attestation for worker image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.WORKER_IMAGE }}
          subject-digest: ${{ steps.push_worker.outputs.digest }}
          push-to-registry: true

      - name: Generate artifact attestation for migrate image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.MIGRATE_IMAGE }}
          subject-digest: ${{ steps.push_migrate.outputs.digest }}
          push-to-registry: true